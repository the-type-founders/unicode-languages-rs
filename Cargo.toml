[package]
name = "unicode-languages"
version = "2.3.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Bram Stein <b.l.stein@gmail.com>"]
description = "A library to detect language coverage given a list of codepoints."
documentation = "https://docs.rs/unicode-languages"
homepage = "https://github.com/the-type-founders/unicode-languages-rs"
repository = "https://github.com/the-type-founders/unicode-languages-rs"
categories = ["text-processing"]
keywords = ["unicode", "language"]

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
