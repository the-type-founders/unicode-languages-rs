[package]
name = "unicode-languages"
version = "3.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
authors = ["Ivan Ukhov <ivan.ukhov@gmail.com>"]
description = "The package provides detection of languages from Unicode codepoints."
documentation = "https://docs.rs/unicode-languages"
repository = "https://github.com/the-type-founders/unicode-languages-rs"
categories = ["text-processing"]
keywords = ["language", "unicode"]

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
